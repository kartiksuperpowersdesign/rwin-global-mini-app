<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RWIN Global - Gift Points</title>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<!-- Graspil Tracking -->
<script type="text/javascript">
(function(w,d,s,l,i){
    w[l]=w[l]||[];
    w[l].push({key:i});
    var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s);
    j.async=true;
    j.src="https://w.graspil.com";
    f.parentNode.insertBefore(j,f);
})(window,document,"script","graspil","398e4f74f6aca5b117c579a81244acb5");
</script>

<style>
:root{
--bg:#f4f8ff;
--card:#fff;
--text:#14213d;
--muted:#6b7890;
--p:#3157d5;
--ok:#16845d;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
max-width:680px;
margin:auto;
padding:16px 14px 35px
}

.hero{
background:linear-gradient(135deg,#3157d5,#6d8cff);
color:#fff;
border-radius:22px;
padding:22px;
box-shadow:0 8px 24px #1c3a7814
}

.brand{
font-weight:800;
font-size:22px
}

.sub{
opacity:.85;
margin-top:4px
}

.balance{
margin-top:18px;
background:#ffffff24;
border:1px solid #ffffff33;
border-radius:16px;
padding:14px
}

.points{
font-size:34px;
font-weight:800
}

.section-title{
font-size:18px;
font-weight:800;
margin:24px 2px 12px
}

.task{
background:var(--card);
border:1px solid #e2e9f5;
border-radius:18px;
padding:16px;
margin-bottom:12px;
box-shadow:0 8px 24px #1c3a7810
}

.row{
display:flex;
justify-content:space-between;
gap:12px;
align-items:center
}

.task h3{
margin:0 0 5px;
font-size:16px
}

.task p{
margin:0;
color:var(--muted);
font-size:13px
}

.reward{
font-weight:800;
color:var(--p);
white-space:nowrap
}

button{
width:100%;
border:0;
border-radius:13px;
padding:13px;
margin-top:14px;
font-weight:800;
font-size:15px;
background:var(--p);
color:#fff
}

button:disabled{
background:#e8f8f1;
color:var(--ok)
}

.note{
margin-top:16px;
padding:12px 14px;
border-radius:14px;
background:#fff8df;
border:1px solid #f1df9a;
color:#725d12;
font-size:12px;
line-height:1.45
}

.user{
margin-top:10px;
font-size:12px;
opacity:.8
}

.referral{
margin-top:14px;
padding:14px;
background:#ffffff20;
border:1px solid #ffffff33;
border-radius:14px;
font-size:13px
}
</style>
</head>

<body>

<div class="wrap">

<section class="hero">

<div class="brand">RWIN GLOBAL</div>

<div class="sub">
Gift Points & Referral Rewards
</div>

<div class="balance">
<div>Your Gift Points</div>
<div class="points" id="balance">0</div>
</div>

<div class="user" id="userInfo"></div>

<div class="referral" id="refInfo">
Referral status: Checking...
</div>

</section>

<div class="section-title">
Available Tasks
</div>

<div id="tasks"></div>

<div class="note">
<b>Reward System</b><br>
Referral Join: B receives 200 Points and A receives 100 Points.<br>
Each completed task gives B 100 Points and A 50 Points.
</div>

</div>

<script>

(function(){

/* =========================
   TELEGRAM
========================= */

const tg =
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;

if(tg){

tg.ready();
tg.expand();

try{

graspil.push({
custom_init_data_row:tg.initData || "",
platform:tg.platform,
version:tg.version,
viewportHeight:tg.viewportHeight,
viewportStableHeight:tg.viewportStableHeight,
colorScheme:tg.colorScheme
});

}catch(e){}

}


/* =========================
   TELEGRAM USER
========================= */

const user =
tg &&
tg.initDataUnsafe &&
tg.initDataUnsafe.user
? tg.initDataUnsafe.user
: null;

const telegramId =
user && user.id
? String(user.id)
: "preview";


/* =========================
   REFERRAL PARAMETER
========================= */

let ref = "";

if(tg &&
tg.initDataUnsafe &&
tg.initDataUnsafe.start_param){

ref = tg.initDataUnsafe.start_param;

}

if(!ref){

const params = new URLSearchParams(location.search);

ref =
params.get("startapp") ||
params.get("start_param") ||
params.get("start") ||
params.get("ref") ||
"";

}


/* =========================
   USER INFO
========================= */

document.getElementById("userInfo").textContent =
user
?
("Telegram: " +
(user.first_name || "") +
(user.username ? " @" + user.username : ""))
:
"Preview mode";


/* =========================
   TASKS
========================= */

const tasks = [

{
id:"task_1_completed",
title:"Task 1",
reward:100
},

{
id:"task_2_completed",
title:"Task 2",
reward:100
},

{
id:"task_3_completed",
title:"Task 3",
reward:100
},

{
id:"task_4_completed",
title:"Task 4",
reward:100
}

];


/* =========================
   USER-SPECIFIC STORAGE
========================= */

const storageKey =
"rwin_gift_points_user_" + telegramId;

let state;

try{

state =
JSON.parse(
localStorage.getItem(storageKey) ||
'{"balance":0,"done":[],"referralRewarded":false}'
);

}catch(e){

state={
balance:0,
done:[],
referralRewarded:false
};

}


/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(
storageKey,
JSON.stringify(state)
);

document.getElementById("balance").textContent =
state.balance;

}


/* =========================
   GRASPIL EVENT TRACKING
========================= */

function trackEvent(eventName, reward){

try{

graspil.push({

event:eventName,

category:"rwin_gift_points",

value_num:reward,

unit:"points",

telegram_user_id:telegramId,

referrer_param:ref || ""

});

}catch(e){}

}


/* =========================
   REFERRAL JOIN
========================= */

function processReferral(){

const refBox =
document.getElementById("refInfo");


if(ref){

refBox.textContent =
"Referral activated ✓";


/*
B gets 200 points.

Only award once for this Telegram user.
*/

if(!state.referralRewarded){

state.balance += 200;

state.referralRewarded = true;

save();


/*
Send referral event to Graspil.

This event is used for A's
100 point referral reward.
*/

trackEvent(
"referral_joined",
200
);

}

}else{

refBox.textContent =
"Direct user";

}

}


/* =========================
   TASK EVENT
========================= */

function completeTask(task, button){

if(state.done.includes(task.id)){
return;
}


/*
B gets 100 points.
*/

state.done.push(task.id);

state.balance += task.reward;

save();


/*
Send task event to Graspil.

Graspil referral rules will give
A 50 points for each task.
*/

trackEvent(
task.id,
task.reward
);


button.disabled = true;

button.textContent =
"✓ Completed";

}


/* =========================
   RENDER TASKS
========================= */

function render(){

const box =
document.getElementById("tasks");

box.innerHTML = "";


tasks.forEach(function(task){

const done =
state.done.includes(task.id);

const card =
document.createElement("div");

card.className = "task";


card.innerHTML =

'<div class="row">' +

'<div>' +

'<h3>' +
task.title +
'</h3>' +

'<p>' +
'Complete this task to earn Gift Points' +
'</p>' +

'</div>' +

'<div class="reward">' +
'+' +
task.reward +
'</div>' +

'</div>' +

'<button ' +
(done ? "disabled" : "") +
'>' +

(done
? "✓ Completed"
: "Complete Task") +

'</button>';


const button =
card.querySelector("button");


if(!done){

button.onclick = function(){

completeTask(
task,
button
);

};

}


box.appendChild(card);

});


save();

}


/* =========================
   START
========================= */

processReferral();

render();


/* =========================
   APP OPEN EVENT
========================= */

trackEvent(
"mini_app_opened",
0
);

})();

</script>

</body>
</html>
